name: Compiler l'APK Mercure VPN

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer les fichiers
        uses: actions/checkout@v4

      - name: Préparer le projet
        run: |
          if [ -f mercure-vpn.zip ]; then
            unzip -q -o mercure-vpn.zip -d build-src
            echo "PROJECT_DIR=build-src/mercure-vpn" >> "$GITHUB_ENV"
          else
            echo "PROJECT_DIR=." >> "$GITHUB_ENV"
          fi

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Installer Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compiler l'APK
        run: |
          cd "$PROJECT_DIR"
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/MercureVPN-test.apk"

      - name: Joindre l'APK au résultat
        uses: actions/upload-artifact@v4
        with:
          name: MercureVPN-APK
          path: MercureVPN-test.apk

      - name: Publier l'APK dans « Releases »
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-test-${{ github.run_number }}
          name: Mercure VPN – test n°${{ github.run_number }}
          files: MercureVPN-test.apk
          prerelease: true
